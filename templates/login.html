<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AffiliateHub</title>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="login-container">
        <div class="login-logo">A</div>
        <h1 class="login-title">AffiliateHub</h1>
        <p class="login-subtitle">Acesse o painel de controle</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" autofocus required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Digite a senha" required>
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div class="register-link">
            Ainda não tem conta? <a href="/register">Criar conta</a>
        </div>
    </div>
</body>
</html>
