<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — AffiliateHub</title>
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="login-container">
        <div class="login-logo">A</div>
        <h1 class="login-title">Criar Conta</h1>
        <p class="login-subtitle">Registre-se no AffiliateHub</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" autofocus required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm">Confirmar Senha</label>
                <input type="password" id="confirm" name="confirm" placeholder="Repita a senha" required minlength="6">
            </div>
            <button type="submit" class="btn-login">Criar Conta</button>
        </form>

        <div class="register-link">
            Já tem conta? <a href="/login">Fazer login</a>
        </div>
    </div>
</body>
</html>
