services:

  # ─── App Flask ──────────────────────────────────────────
  app:
    build: .
    container_name: affiliatehub-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - FLASK_DEBUG=false
      - DATABASE_URL=postgresql://affiliatehub:${POSTGRES_PASSWORD}@postgres:5432/affiliatehub
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - PORT=5000
    networks:
      - internal
    expose:
      - "5000"

  # ─── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: affiliatehub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliatehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: affiliatehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliatehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Evolution API (WhatsApp) ───────────────────────────
  evolution:
    image: atendai/evolution-api:v1.8.7
    container_name: affiliatehub-evolution
    restart: unless-stopped
    environment:
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - internal
    expose:
      - "8080"

  # ─── Nginx (Reverse Proxy + SSL) ───────────────────────
  nginx:
    image: nginx:alpine
    container_name: affiliatehub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - internal

  # ─── Certbot (SSL automático) ──────────────────────────
  certbot:
    image: certbot/certbot
    container_name: affiliatehub-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - internal

volumes:
  postgres_data:
  evolution_data:
  certbot_data:
  certbot_www:

networks:
  internal:
    driver: bridge
